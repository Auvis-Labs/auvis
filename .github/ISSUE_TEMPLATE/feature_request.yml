name: 🚀 Feature Request
description: Propose a new feature, source connector, destination sink, or enhancement
title: "[Feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Auvis!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what problem or use case this feature solves.
      placeholder: I'm trying to governance data going into [X], but currently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
      placeholder: Add support for [X] source connector / policy rule action / destination driver...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any mockups, links to API specifications, or context.
