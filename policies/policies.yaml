policies:
  # Root array — jsonplaceholder returns [...] directly
  # data_path omitted → operates on root
  - name: analyst-users
    description: "GDPR-aligned PII reduction for analyst role on /users"
    tags: [gdpr, pii]
    match:
      roles: [analyst, data-scientist]
      resource: /users
    rules:
      - field: email
        action: mask
      - field: phone
        action: remove
      - field: address
        action: remove
      - field: company
        action: remove

  - name: analyst-wrapped-users
    description: "Same PII rules but for APIs that wrap their response in a data envelope"
    tags: [gdpr, pii]
    match:
      roles: [analyst]
      resource: /v2/users
    response:
      data_path: "data"   # drill into response["data"] before transforming
    rules:
      - field: email
        action: mask
      - field: phone
        action: remove
      - field: address
        action: remove

  - name: analyst-nested-users
    description: "PII rules for APIs with deeply nested record paths"
    tags: [gdpr, pii]
    match:
      roles: [analyst]
      resource: /v3/users
    response:
      data_path: "result.users"  # drill two levels deep
    rules:
      - field: email
        action: mask
      - field: phone
        action: remove

  - name: admin-users
    match:
      roles: [admin]
      resource: /users
    rules:
      - field: "*"
        action: allow

  - name: block-guest
    match:
      roles: [guest]
      resource: /users
    rules:
      - field: "*"
        action: deny